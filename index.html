    ::selection{background:#C8E6C9;color:#0E2A12;}

    /* keyboard focus, always visible */
    button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #2E7D32;outline-offset:2px;border-radius:6px;}
    input[type=checkbox]:focus-visible{outline:2px solid #2E7D32;outline-offset:2px;}
    button{transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s;}
    button[aria-expanded]:hover{border-color:#2E7D32 !important;box-shadow:0 0 0 3px rgba(46,125,50,.12);}
    button.btn-reset:hover{background:#E8F5E9 !important;}

    /* dropdown rows */
    label{border-radius:7px;}
    label:hover{background:#F0F7F1;}

    /* tables */
    table{font-variant-numeric:tabular-nums;}
    thead th{font-weight:600 !important;letter-spacing:.03em;white-space:nowrap;}
    thead th:first-child{border-top-left-radius:8px;}
    thead th:last-child{border-top-right-radius:8px;}
    tbody tr{transition:background-color .12s;}
    tbody tr:hover{background-color:#E9F3EA !important;}
    tbody td{border-bottom:1px solid #EDF2EE;}
    tbody tr:last-child td{border-bottom:0;}

    /* filter bar helpers */
    .hint{font-size:12px;color:#5C6B61;font-style:italic;}
    @media (max-width:699px){.hint{flex-basis:100%;order:5;}.count{margin-left:0 !important;}}

    /* thin, quiet scrollbars for the wide tables */
    *{scrollbar-width:thin;scrollbar-color:#B9CBBC transparent;}
    ::-webkit-scrollbar{height:8px;width:8px;}
    ::-webkit-scrollbar-thumb{background:#B9CBBC;border-radius:8px;}

    @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
    @media print{body{background:#fff;} button[aria-expanded]{display:none;}}
  </style>
